version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - dogsled
    - gocritic
    - godot
    - misspell
    - noctx
    - prealloc
    - unconvert
    - unparam
    - whitespace
  settings:
    govet:
      enable-all: true
    misspell:
      locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
